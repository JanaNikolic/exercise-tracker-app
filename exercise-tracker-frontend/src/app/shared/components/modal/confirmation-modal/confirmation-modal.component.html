<div
  class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-150"
>
  <div
    class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl border border-slate-100 animate-in fade-in zoom-in-95 duration-150"
  >
    <h4 class="text-base font-bold text-slate-800 mb-1">{{ title() }}</h4>
    <p class="text-sm text-slate-500 mb-6">{{ message() }}</p>

    <div class="flex gap-3 justify-end">
      <button
        type="button"
        (click)="onCancel()"
        class="px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-600 hover:bg-slate-100 font-medium text-sm transition duration-150 cursor-pointer"
      >
        {{ cancelBtnText() }}
      </button>

      <button
        type="button"
        (click)="onConfirm()"
        [class.bg-rose-600]="variant() === 'rose'"
        [class.hover:bg-rose-700]="variant() === 'rose'"
        [class.shadow-rose-600/10]="variant() === 'rose'"
        [class.bg-emerald-600]="variant() === 'emerald'"
        [class.hover:bg-emerald-700]="variant() === 'emerald'"
        [class.shadow-emerald-600/10]="variant() === 'emerald'"
        class="px-4 py-2 text-white rounded-xl font-medium text-sm transition duration-150 shadow-sm cursor-pointer"
      >
        {{ confirmBtnText() }}
      </button>
    </div>
  </div>
</div>
